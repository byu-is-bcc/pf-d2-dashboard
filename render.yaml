services:
  - type: web
    name: pf-d2-ship-the-model
    runtime: python
    plan: free
    region: oregon

    # Training runs at build time, because models/model.joblib is
    # gitignored. This is a real tradeoff and you should know which side of
    # it you are on: a build that trains is reproducible from source but
    # ties every deploy to a training run, and the model your service
    # serves is whatever came out of the last build rather than an artifact
    # you tested. For anything bigger than this, you train once, publish
    # the artifact to object storage, and have the build download a
    # specific version.
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Add your own secrets here as `sync: false`, which tells Render to
      # prompt for the value instead of reading it from this committed
      # file. Never put the value itself in here.
      # - key: SUPABASE_KEY
      #   sync: false
