# Two jobs, and they are supposed to disagree with each other.
#
# `smoke` must stay green. It proves the seed builds, the app runs, the queries
# are valid SQL, and the quality gates execute. If it goes red, you broke the
# scaffolding rather than the assignment.
#
# `dashboard` is red the moment you click "Use this template", because the
# things it checks are the things the template refuses to decide for you. That
# red X is the assignment, visible from the repository page. It turns green when
# you finish, and a reviewer can tell at a glance which of the two you are.
#
# Note what this is NOT: a deploy pipeline. Streamlit Community Cloud watches
# your repository and redeploys on push by itself. The coursework audit found
# that every GitHub Actions workflow across the whole IS core was deploy-only,
# with no test step, meaning no pipeline could ever fail for a reason other than
# a build error. This one can, which is the entire point of having it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: smoke (must stay green)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The database is gitignored, so CI builds it exactly the way a fresh
      # clone does. If this step fails, a new student cannot start.
      - name: Build the seed database
        run: python scripts/build_seed_db.py

      - name: Data quality gates (core suite)
        run: python scripts/checks.py --suite core

      - name: The gates actually fire when the data is bad
        run: |
          # A gate that cannot fail is not a gate. This runs the suite against a
          # deliberately damaged copy and requires a non-zero exit. If someone
          # softens a threshold until nothing can ever trip, this catches it.
          if python scripts/checks.py --demo-failure; then
            echo "::error::--demo-failure exited 0. The gates did not fire on broken data."
            exit 1
          fi
          echo "Gates fired on damaged data, as they should."

      - name: The app starts and gets its numbers from the database
        run: python scripts/smoke_test.py

      - name: The source data is actually committed
        run: |
          # Shipping a template with no data has happened in this program
          # before. It is a hard failure: the first command in the README does
          # not work and the student is stuck before they start.
          if ! git ls-files --error-unmatch data/library_loans.csv > /dev/null 2>&1; then
            echo "::error::data/library_loans.csv is not tracked. Check .gitignore."
            exit 1
          fi
          echo "Source extract is tracked."

      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)(\.env|secrets\.toml)$'; then
            echo "::error::A secrets file is tracked in git. Remove it and rotate the credentials."
            exit 1
          fi
          echo "No tracked secrets."

  dashboard:
    name: dashboard (red until you finish it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the seed database
        run: python scripts/build_seed_db.py

      # Expected to fail on a fresh template. Every line it prints names one
      # thing the template deliberately left undecided, so the log is the
      # to-do list.
      - name: You have made the decisions the template refuses to make
        run: python scripts/check_decisions.py

      # Also expected to fail. These are the two gates you have to write.
      - name: The quality gates that are yours to write
        if: '!cancelled()'
        run: python scripts/checks.py --suite student
