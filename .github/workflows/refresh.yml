# Daily refresh. The difference between a dashboard and a screenshot.
#
# Runs scripts/refresh.py: fetch → build → gate → record. The workflow
# commits data/refresh_state.json back to the repository when it changes,
# so the deployed app (and a reviewer) can see whether the last run passed
# or failed without digging through Actions logs.
#
# On a fresh template pointed at the static library seed, consecutive runs
# produce the same numbers. That is expected. The pipeline still has to run,
# still has to write state, and still has to exit non-zero when a gate fails.
# Point fetch() at a living source when you are ready for the numbers to move.

name: Refresh

on:
  schedule:
    # 13:00 UTC — mid-morning US Mountain, after most nightly extracts land.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: fetch → build → gate → record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the refresh pipeline
        id: refresh
        continue-on-error: true
        run: python scripts/refresh.py

      - name: Commit refresh_state.json if it changed
        run: |
          if [ ! -f data/refresh_state.json ]; then
            echo "::error::refresh.py did not write data/refresh_state.json"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refresh_state.json
          if git diff --staged --quiet; then
            echo "refresh_state.json unchanged"
          else
            git commit -m "chore: record scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Fail the job if the pipeline failed
        if: steps.refresh.outcome != 'success'
        run: |
          echo "::error::Refresh pipeline exited non-zero. A blocking gate fired, or a step crashed. See the Run the refresh pipeline step."
          exit 1
