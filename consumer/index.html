<!DOCTYPE html>
<!--
  The consumer. A single page that calls your deployed model over HTTP.

  This is a starting point, not a finished thing. The fetch call is a TODO.

  The point of this file is the network boundary. Open it as a local file
  and it still has to reach across the internet to your service, which
  means you will hit CORS, and hitting CORS is part of the lesson: your
  model and its caller are separate deployed things and the browser knows
  it. Fixing it means adding CORSMiddleware to app/main.py and deciding
  which origins you are willing to allow.

  Host this on the site you built in Project 000, so the thing calling your
  model is itself deployed. A local file that calls a live API proves less
  than two deployed things talking to each other.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Escalation — predict</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
    input { width: 100%; padding: .4rem; font: inherit; }
    button { margin-top: 1.25rem; padding: .5rem 1rem; font: inherit; }
    #result { margin-top: 1.5rem; padding: 1rem; background: #f4f4f5; white-space: pre-wrap; }
    .muted { color: #666; font-size: .875rem; }
  </style>
</head>
<body>
  <h1>Will this ticket be escalated?</h1>
  <p class="muted">Calls a model deployed at a different origin than this page.</p>

  <form id="ticket">
    <label for="ticket_age_hours">Ticket age (hours)</label>
    <input id="ticket_age_hours" name="ticket_age_hours" type="number" step="0.1" value="36" required>

    <label for="customer_tenure_days">Customer tenure (days)</label>
    <input id="customer_tenure_days" name="customer_tenure_days" type="number" value="820" required>

    <label for="prior_tickets_90d">Prior tickets, last 90 days</label>
    <input id="prior_tickets_90d" name="prior_tickets_90d" type="number" value="3" required>

    <label for="message_count">Messages on this ticket</label>
    <input id="message_count" name="message_count" type="number" value="7" required>

    <label for="account_seats">Account seats</label>
    <input id="account_seats" name="account_seats" type="number" value="240" required>

    <label for="plan_tier_rank">Plan tier (1 to 4)</label>
    <input id="plan_tier_rank" name="plan_tier_rank" type="number" min="1" max="4" value="2" required>

    <button type="submit">Predict</button>
  </form>

  <div id="result" hidden></div>

  <script>
    // TODO(you): point this at your deployed service.
    const API_URL = "http://localhost:8000/predict";

    const form = document.getElementById("ticket");
    const result = document.getElementById("result");

    function readForm() {
      const data = new FormData(form);
      const payload = {};
      for (const [key, value] of data.entries()) {
        payload[key] = Number(value);
      }
      return payload;
    }

    function show(text) {
      result.hidden = false;
      result.textContent = text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      show("Calling the model...");

      // TODO(you): POST readForm() to API_URL as JSON and render the
      // response.
      //
      // Three things this has to handle, and a reviewer will try all of
      // them:
      //   - a successful prediction, rendered as something a human reads
      //     rather than as raw JSON
      //   - a 422, meaning the service rejected the input. Say which field.
      //   - the service being asleep or unreachable. A free tier cold
      //     start takes several seconds and a page that shows nothing
      //     during it looks broken.
      //
      // Do not put an API key in this file. It ships to the browser.
      show("Not wired up yet. See the TODO in consumer/index.html.");
    });
  </script>
</body>
</html>
